name: Bug report
description: Report a reproducible problem in Sonora
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sonora version and Windows version
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or relevant logs
      description: Remove account details, tokens, and personal information before sharing.
