<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc">
<title id="title">Sonora muted editorial mood board</title>
<desc id="desc">Conceptual compositions using Sonora's theme colors and accents. This is design reference artwork, not an application screenshot.</desc>
<defs>
  <linearGradient id="warm" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#17151C"/><stop offset="1" stop-color="#C9A96E"/></linearGradient>
  <linearGradient id="night" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#17151C"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
</defs>
<rect width="1080" height="450" rx="20" fill="#17151C"/>
<text x="35" y="48" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#F4F0F6">SONORA / MUTED EDITORIAL</text>
<text x="35" y="75" font-family="Segoe UI, sans-serif" font-size="14" fill="#A9A3B3">Concept board - palette, shape, and atmosphere</text>
<g transform="translate(35 100)">
  <rect width="320" height="280" rx="16" fill="#211E29" stroke="#393342"/>
  <rect x="18" y="18" width="284" height="155" rx="10" fill="#F0EBDD"/>
  <rect x="36" y="40" width="75" height="75" rx="38" fill="#315E48"/>
  <rect x="125" y="43" width="132" height="8" rx="4" fill="#315E48"/>
  <rect x="125" y="62" width="98" height="6" rx="3" fill="#6C7169"/>
  <text x="18" y="210" font-family="Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#F4F0F6">Bone Editorial</text>
  <text x="18" y="238" font-family="Segoe UI, sans-serif" font-size="13" fill="#A9A3B3">Bone / Bottle Green / Cinematic</text>
</g>
<g transform="translate(380 100)">
  <rect width="320" height="280" rx="16" fill="#211E29" stroke="#393342"/>
  <rect x="18" y="18" width="284" height="155" rx="10" fill="url(#warm)"/>
  <circle cx="160" cy="95" r="47" fill="#17151C" fill-opacity=".62" stroke="#C9A96E"/>
  <circle cx="160" cy="95" r="5" fill="#C9A96E"/>
  <text x="18" y="210" font-family="Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#F4F0F6">Sunset Tape</text>
  <text x="18" y="238" font-family="Segoe UI, sans-serif" font-size="13" fill="#A9A3B3">Charcoal / Muted Gold / Glow</text>
</g>
<g transform="translate(725 100)">
  <rect width="320" height="280" rx="16" fill="#211E29" stroke="#393342"/>
  <rect x="18" y="18" width="284" height="155" rx="10" fill="url(#night)"/>
  <circle cx="160" cy="95" r="48" fill="#17151C" fill-opacity=".7" stroke="#A78BFA"/>
  <circle cx="160" cy="95" r="29" fill="none" stroke="#A78BFA" stroke-opacity=".4"/>
  <circle cx="160" cy="95" r="5" fill="#A78BFA"/>
  <text x="18" y="210" font-family="Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#F4F0F6">Midnight Vinyl</text>
  <text x="18" y="238" font-family="Segoe UI, sans-serif" font-size="13" fill="#A9A3B3">Charcoal / Dusty Purple / Minimal</text>
</g>
<text x="35" y="421" font-family="Segoe UI, sans-serif" font-size="12" fill="#A9A3B3">Design recipes, not built-in presets or application screenshots.</text>
</svg>
