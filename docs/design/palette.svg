<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">Sonora palette</title>
<desc id="desc">The two theme backgrounds and eight accent colors used in Sonora Settings.</desc>
<rect width="1000" height="340" rx="20" fill="#211E29"/>
