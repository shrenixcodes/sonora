<rect x="28" y="210" width="178" height="64" rx="8" fill="#C9A96E" stroke="#736D7E"/>
<text x="28" y="294" fill="#F4F0F6" font-family="Segoe UI, sans-serif" font-size="13">Muted Gold</text>
