<text x="416" y="174" fill="#F4F0F6" font-family="Segoe UI, sans-serif" font-size="13">Dusty Purple</text>
<text x="416" y="192" fill="#A9A3B3" font-family="Consolas, monospace" font-size="12">#A78BFA</text>
<rect x="610" y="90" width="178" height="64" rx="8" fill="#315E48" stroke="#736D7E"/>
<text x="610" y="174" fill="#F4F0F6" font-family="Segoe UI, sans-serif" font-size="13">Bottle Green</text>
<text x="610" y="192" fill="#A9A3B3" font-family="Consolas, monospace" font-size="12">#315E48</text>
<rect x="804" y="90" width="178" height="64" rx="8" fill="#3B82F6" stroke="#736D7E"/>
<text x="804" y="174" fill="#F4F0F6" font-family="Segoe UI, sans-serif" font-size="13">Electric Blue</text>
