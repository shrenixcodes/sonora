<text x="28" y="68" fill="#A9A3B3" font-family="Segoe UI, sans-serif" font-size="13">Theme backgrounds and selectable accents</text>
<rect x="28" y="90" width="178" height="64" rx="8" fill="#17151C" stroke="#736D7E"/>
<text x="28" y="174" fill="#F4F0F6" font-family="Segoe UI, sans-serif" font-size="13">Charcoal</text>
<text x="28" y="192" fill="#A9A3B3" font-family="Consolas, monospace" font-size="12">#17151C</text>
<rect x="222" y="90" width="178" height="64" rx="8" fill="#F0EBDD" stroke="#736D7E"/>
<text x="222" y="174" fill="#F4F0F6" font-family="Segoe UI, sans-serif" font-size="13">Bone</text>
<text x="222" y="192" fill="#A9A3B3" font-family="Consolas, monospace" font-size="12">#F0EBDD</text>
