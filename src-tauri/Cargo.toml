[package]
name = "sonora"
version = "0.6.1"
description = "An immersive YouTube Music desktop client"
authors = ["Shreyan Bag"]
repository = "https://github.com/shrenixcodes/sonora"
edition = "2024"

[lib]
name = "sonora_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
discord-rich-presence = "1.1.0"

[target.'cfg(windows)'.dependencies]
adblock = { version = "0.13.6", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
webview2-com = "0.39.1"
ureq = "3.5.2"
# Already in the dependency tree through Tauri.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
