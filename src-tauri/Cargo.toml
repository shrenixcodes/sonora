[package]
name = "sonora"
version = "0.2.0"
description = "An immersive YouTube Music desktop client"
authors = ["Shreyan Bag"]
edition = "2024"

[lib]
name = "sonora_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
